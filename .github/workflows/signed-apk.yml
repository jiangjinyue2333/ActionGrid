name: Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ACTIONGRID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > actiongrid-release.jks

      - name: Sign APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ACTIONGRID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ACTIONGRID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ACTIONGRID_RELEASE_KEY_PASSWORD }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="app/build/outputs/apk/release/app-release-aligned.apk"
          signed="app/build/outputs/apk/release/ActionGrid-release.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks actiongrid-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$build_tools/apksigner" verify --verbose "$signed"
          rm -f actiongrid-release.jks "$aligned"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ActionGrid-signed-apk
          path: app/build/outputs/apk/release/ActionGrid-release.apk
