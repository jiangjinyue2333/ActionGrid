name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure Gradle cache
        run: |
          "GRADLE_USER_HOME=$env:RUNNER_TEMP/gradle" >> $env:GITHUB_ENV

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV

      - name: Verify project structure
        run: ./scripts/verify-project-structure.ps1

      - name: Test, lint and unsigned build
        run: ./gradlew.bat test lint assembleRelease

      - name: Verify APK installation ABI
        run: ./scripts/test-apk-abi.ps1 -ApkPath app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify native capability policy
        run: ./scripts/test-native-policy.ps1

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ActionGrid-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure temporary paths
        run: |
          "GRADLE_USER_HOME=$env:RUNNER_TEMP/gradle" >> $env:GITHUB_ENV
          "ACTIONGRID_RELEASE_STORE_FILE=$env:RUNNER_TEMP/actiongrid-release.jks" >> $env:GITHUB_ENV

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV

      - name: Restore signing key
        env:
          ACTIONGRID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ACTIONGRID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACTIONGRID_RELEASE_KEYSTORE_BASE64)) {
            throw 'Configure ACTIONGRID_RELEASE_KEYSTORE_BASE64 in repository Actions secrets'
          }
          [IO.File]::WriteAllBytes($env:ACTIONGRID_RELEASE_STORE_FILE, [Convert]::FromBase64String($env:ACTIONGRID_RELEASE_KEYSTORE_BASE64))

      - name: Build, sign and verify release APK
        env:
          ACTIONGRID_RELEASE_STORE_PASSWORD: ${{ secrets.ACTIONGRID_RELEASE_STORE_PASSWORD }}
          ACTIONGRID_RELEASE_KEY_ALIAS: ${{ secrets.ACTIONGRID_RELEASE_KEY_ALIAS }}
          ACTIONGRID_RELEASE_KEY_PASSWORD: ${{ secrets.ACTIONGRID_RELEASE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -ReleaseTag $env:GITHUB_REF_NAME

      - name: Generate GitHub update manifest
        run: |
          $apk = Get-ChildItem -LiteralPath artifacts -Filter 'ActionGrid-*.apk' -File | Select-Object -First 1
          if ($null -eq $apk) {
            throw '找不到已验证的发布 APK'
          }
          ./scripts/create-update-manifest.ps1 -ApkPath $apk.FullName -ReleaseTag $env:GITHUB_REF_NAME -OutputPath artifacts/latest.json

      - name: Upload verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ActionGrid-signed-${{ github.run_number }}
          path: |
            artifacts/ActionGrid-*.apk
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = Get-ChildItem -LiteralPath artifacts -Filter 'ActionGrid-*.apk' -File | Select-Object -First 1
          $manifest = Get-Item -LiteralPath artifacts/latest.json
          if ($null -eq $apk) {
            throw '找不到已验证的发布 APK'
          }
          if ($null -eq $manifest) {
            throw '找不到 GitHub 更新清单'
          }
          gh release create $env:GITHUB_REF_NAME $apk.FullName $manifest.FullName --title "ActionGrid $env:GITHUB_REF_NAME" --generate-notes

      - name: Remove temporary signing key
        if: always()
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/actiongrid-release.jks" -Force -ErrorAction SilentlyContinue
